<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Products</title>
</head>
<body>
    <header class="header-bg">
        <div class="container header-grid">
        <nav class="header-nav">
            <ul class="header-list">
                <li><a href="./products.html">PRODUTO</a></li>
                <li><a href="./inventory.html">ESTOQUE</a></li>
                <li><a href="./releases.html">LANÇAMENTOS</a></li>
            </ul>
        </nav>
        <div class="header-user">
            <span data-user="usuario">Usuário</span>
        </div>
        </div>
    </header>

    <main>
        <section class="products container" id="produto">
            <div class="products-register">
                <h2>Inventário</h2>
            </div>
            <p class="products-not-exists">Não existe produtos criados.</p>
            <div class="products-item">
                <ul class="products-list">
                </ul>
            </div>
            <div class="products-description-bg">
                <div id="inventory">
                    <h3>Estoque</h3>
                    <div class="inventory-product">
                        <p id="estoque-nome">Nome:</p>
                        <p id="estoque-custo">Custo:</p>
                        <p id="estoque-tipo">Tipo:</p>
                        <p id="estoque-descricao">Descricao:</p>
                    </div>

                    <div class="inventory-display">
                        <span id="inventory-disponivel">Estoque Disponível:</span>
                    </div>
                         
                    <h3>Lançamentos</h3>
                    <div class="inventory-releases">
                        <p>Produto criado</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script type="module" src="js/script.js"></script>
</body>
</html>
