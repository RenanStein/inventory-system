<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Products</title>
</head>
<body>
    <header class="header-bg">
        <div class="container header-grid">
        <nav class="header-nav">
            <ul class="header-list">
                <li><a href="./products.html">PRODUTO</a></li>
                <li><a href="./inventory.html">ESTOQUE</a></li>
                <li><a href="#aa">LANÇAMENTOS</a></li>
            </ul>
        </nav>
        <div class="header-user">
            <span data-user="usuario">Usuário</span>
        </div>
        </div>
    </header>

    <main>
        <section class="releases container">
            <div class="releases-action">
                <h2>Implantação</h2>
                <button data-estoque="add" class="button-geral">Criar implantação</button>
            </div>
            <div class="releases-action">
                <h2>Requisição</h2>
                <button data-estoque="rem" class="button-geral">Criar requisição</button>
            </div>
        </section>

        <div class="modal-releases">
            <div class="modal-releases-container">
                <h3 id="titulo_lancamento">Implantacao</h3>

                <span>Produto</span>
                <select name="produtos" id="produtos_opcoes">
                </select>

                <label for="quantidade_lancamento">Quantidade</label>
                <input type="number" placeholder="Quantidade" id="quantidade_lancamento" name="quantidade_lancamento">
                
                <label for="custo_lancamento" class="custo">Custo</label>
                <input type="number" class="custo-input" placeholder="Custo" id="custo_lancamento" name="custo_lancamento">

                    <span class="avisoErroLancamento">Teste teste</span>
                <div>
                    <button class="products-modal-confir button-geral" id="confirLancamento">Confirmar</button>
                    <button class="products-modal-cance button-geral" id="cancelLancamento">Cancelar</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/script.js"></script>
</body>
</html>
